apiVersion: apps/v1
kind: Deployment
metadata:
 name: product-service
 namespace: product-service
 labels:
   app: product-service
spec:
 replicas: 2
 selector:
   matchLabels:
     app: product-service
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 template:
   metadata:
     labels:
       app: product-service

   spec:
     containers:
       - name: product-service
         image: luckystrike1989/product-service:sha-640086c
         imagePullPolicy: Always
         ports:
           - containerPort: 8081
         envFrom:
           - configMapRef:
               name: product-service-config
         resources:
           requests:
             cpu: "100m"
             memory: "256Mi"
           limits:
             cpu: "500m"
             memory: "512Mi"
         livenessProbe:
           httpGet:
             path: /actuator/health/liveness
             port: 8081
           initialDelaySeconds: 30
           periodSeconds: 15
           failureThreshold: 3
         readinessProbe:
           httpGet:
             path: /actuator/health/readiness
             port: 8081
           initialDelaySeconds: 20
           periodSeconds: 10
           failureThreshold: 3
     terminationGracePeriodSeconds: 30
